<!doctype html>
<html lang="en">
  <head>
    <title>Agent Hands | XR Blocks</title>
    <meta charset="utf-8" />
    <link rel="icon" href="data:," />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=no"
    />
    <meta
      http-equiv="Cache-Control"
      content="no-cache, no-store, must-revalidate"
    />
    <link rel="stylesheet" href="styles.css" />
    <style>
      .key-overlay {
        position: fixed;
        inset: 0;
        z-index: 100;
        background: rgba(0, 0, 0, 0.85);
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: system-ui, sans-serif;
        color: #eee;
      }
      .key-card {
        background: #1a1a1a;
        padding: 24px 28px;
        border-radius: 12px;
        max-width: 440px;
        width: 90%;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
      }
      .key-card h2 {
        margin: 0 0 8px;
        font-size: 18px;
      }
      .key-card p {
        margin: 0 0 16px;
        font-size: 13px;
        color: #aaa;
        line-height: 1.4;
      }
      .key-card a {
        color: #4a90e2;
      }
      .key-card input {
        width: 100%;
        padding: 10px 12px;
        border-radius: 8px;
        border: 1px solid #555;
        background: #111;
        color: #eee;
        font-size: 14px;
        box-sizing: border-box;
        margin-bottom: 12px;
      }
      .key-card button {
        padding: 10px 20px;
        border-radius: 8px;
        border: none;
        background: #4a90e2;
        color: white;
        cursor: pointer;
        font-size: 14px;
      }
      .key-card .skip {
        display: inline-block;
        margin-left: 14px;
        font-size: 13px;
        color: #888;
        cursor: pointer;
        text-decoration: underline;
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js",
          "three/": "https://cdn.jsdelivr.net/npm/three@0.186.0/",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.0/examples/jsm/",
          "lit": "https://esm.sh/lit@3.3.1",
          "lit/": "https://esm.sh/lit@3.3.1/",
          "@pmndrs/uikit": "https://cdn.jsdelivr.net/npm/@pmndrs/uikit@1.0.64/dist/index.min.js",
          "@pmndrs/uikit-pub-sub": "https://cdn.jsdelivr.net/npm/@pmndrs/uikit-pub-sub@1.0.64/dist/index.min.js",
          "@pmndrs/msdfonts": "https://cdn.jsdelivr.net/npm/@pmndrs/msdfonts@1.0.64/dist/index.min.js",
          "@pmndrs/msdfonts/inter": "https://cdn.jsdelivr.net/npm/@pmndrs/msdfonts@1.0.64/dist/inter.js",
          "@pmndrs/msdfonts/": "https://cdn.jsdelivr.net/npm/@pmndrs/msdfonts@1.0.64/dist/",
          "zod": "https://cdn.jsdelivr.net/npm/zod@4.4.3/+esm",
          "@preact/signals-core": "https://cdn.jsdelivr.net/npm/@preact/signals-core@1.14.0/dist/signals-core.mjs",
          "yoga-layout/load": "https://cdn.jsdelivr.net/npm/yoga-layout@3.2.1/dist/src/load.js",
          "xrblocks": "https://cdn.jsdelivr.net/npm/xrblocks@0.24.0/build/xrblocks.js",
          "@google/genai": "https://cdn.jsdelivr.net/npm/@google/genai@2.27.0/+esm",
          "three/webgpu": "https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.webgpu.js",
          "three/tsl": "https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.tsl.js"
        }
      }
    </script>
  </head>
  <body>
    <div id="keyOverlay" class="key-overlay" style="display: none">
      <div class="key-card">
        <h2>Gemini API key</h2>
        <p>
          Add a Gemini API key to talk to the agent. Get one from
          <a
            href="https://aistudio.google.com/app/apikey"
            target="_blank"
            rel="noopener"
            >aistudio.google.com</a
          >. The key is saved in your browser's localStorage and only sent to
          Google. Without a key the demo plays a short scripted monologue.
        </p>
        <input id="keyInput" type="password" placeholder="AIza..." />
        <button id="keySave">save and reload</button>
        <span id="keySkip" class="skip">watch the scripted demo</span>
      </div>
    </div>

    <div
      id="status"
      style="
        position: fixed;
        top: 12px;
        left: 12px;
        z-index: 50;
        max-width: 420px;
        padding: 10px 14px;
        border-radius: 8px;
        background: rgba(20, 20, 30, 0.78);
        color: #eee;
        font:
          13px/1.4 system-ui,
          sans-serif;
      "
    >
      the agent will gesture as it speaks...
    </div>
    <button
      id="talk"
      style="
        position: fixed;
        top: 12px;
        right: 12px;
        z-index: 50;
        padding: 10px 18px;
        border: none;
        border-radius: 24px;
        background: #9177c7;
        color: #fff;
        font-size: 14px;
        cursor: pointer;
        display: none;
      "
    >
      🎙️ Talk
    </button>
    <script type="module" src="build/main.js"></script>
  </body>
</html>
