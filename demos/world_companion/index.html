<!doctype html>
<html lang="en">
  <head>
    <title>World Companion | XR Blocks</title>
    <meta charset="utf-8" />
    <link rel="icon" href="data:," />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=no"
    />
    <link rel="stylesheet" href="styles.css" />

    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js",
          "three/": "https://cdn.jsdelivr.net/npm/three@0.186.0/",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.0/examples/jsm/",
          "lit": "https://esm.sh/lit@3.3.1",
          "lit/": "https://esm.sh/lit@3.3.1/",
          "@pmndrs/uikit": "https://cdn.jsdelivr.net/npm/@pmndrs/uikit@1.0.64/dist/index.min.js",
          "@pmndrs/uikit-pub-sub": "https://cdn.jsdelivr.net/npm/@pmndrs/uikit-pub-sub@1.0.64/dist/index.min.js",
          "@pmndrs/msdfonts": "https://cdn.jsdelivr.net/npm/@pmndrs/msdfonts@1.0.64/dist/index.min.js",
          "@pmndrs/msdfonts/inter": "https://cdn.jsdelivr.net/npm/@pmndrs/msdfonts@1.0.64/dist/inter.js",
          "@pmndrs/msdfonts/": "https://cdn.jsdelivr.net/npm/@pmndrs/msdfonts@1.0.64/dist/",
          "zod": "https://cdn.jsdelivr.net/npm/zod@4.4.3/+esm",
          "@preact/signals-core": "https://cdn.jsdelivr.net/npm/@preact/signals-core@1.14.0/dist/signals-core.mjs",
          "yoga-layout/load": "https://cdn.jsdelivr.net/npm/yoga-layout@3.2.1/dist/src/load.js",
          "xrblocks": "https://cdn.jsdelivr.net/npm/xrblocks@0.24.0/build/xrblocks.js",
          "@google/genai": "https://cdn.jsdelivr.net/npm/@google/genai@2.27.0/+esm",
          "marked": "https://esm.sh/marked@14.1.4",
          "dompurify": "https://esm.sh/dompurify@3.4.17",
          "three/webgpu": "https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.webgpu.js",
          "three/tsl": "https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.tsl.js"
        }
      }
    </script>
    <style>
      .panel {
        position: fixed;
        bottom: 24px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 10;
        display: flex;
        flex-direction: column;
        gap: 10px;
        background: rgba(20, 20, 20, 0.85);
        padding: 14px 18px;
        border-radius: 12px;
        font-family: system-ui, sans-serif;
        color: #eee;
        max-width: 540px;
        width: 92%;
      }
      .panel button {
        padding: 9px 14px;
        border-radius: 8px;
        border: 1px solid #444;
        background: #2a2a2a;
        color: white;
        cursor: pointer;
        font-size: 14px;
        text-transform: none;
      }
      .panel button:hover:not(:disabled) {
        background: #3a3a3a;
      }
      .panel button:disabled {
        opacity: 0.4;
        cursor: default;
      }
      .panel .row {
        display: flex;
        gap: 8px;
      }
      .panel .start {
        background: #2e7d32;
      }
      .panel .stop {
        background: #c0392b;
      }
      .panel .transcript {
        height: 80px;
        overflow-y: auto;
        font-size: 13px;
        line-height: 1.4;
        padding: 8px 10px;
        background: #111;
        border-radius: 8px;
      }
      .panel .transcript p,
      .panel .transcript ul,
      .panel .transcript ol {
        margin: 0 0 0.4em 0;
      }
      .panel .transcript ul,
      .panel .transcript ol {
        padding-left: 1.2em;
      }
      .panel .transcript .turn {
        margin: 0 0 0.5em 0;
      }
      .panel .transcript .turn .who {
        font-weight: 600;
        margin-right: 4px;
      }
      .panel .transcript .turn.user .who {
        color: #6cb6ff;
      }
      .panel .transcript .turn.model .who {
        color: #7ee787;
      }
      .panel .transcript .turn.user {
        color: #cfd8e3;
      }
      .panel .transcript:empty::before {
        content: 'Press Start, then talk to the companion. It can see what the camera sees.';
        color: #888;
        font-style: italic;
      }
      .panel .status {
        font-size: 12px;
        color: #aaa;
      }
      .key-overlay {
        position: fixed;
        inset: 0;
        z-index: 100;
        background: rgba(0, 0, 0, 0.85);
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: system-ui, sans-serif;
        color: #eee;
      }
      .key-card {
        background: #1a1a1a;
        padding: 24px 28px;
        border-radius: 12px;
        max-width: 440px;
        width: 90%;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
      }
      .key-card h2 {
        margin: 0 0 8px;
        font-size: 18px;
      }
      .key-card p {
        margin: 0 0 16px;
        font-size: 13px;
        color: #aaa;
        line-height: 1.4;
      }
      .key-card a {
        color: #4a90e2;
      }
      .key-card input {
        width: 100%;
        padding: 10px 12px;
        border-radius: 8px;
        border: 1px solid #555;
        background: #111;
        color: #eee;
        font-size: 14px;
        box-sizing: border-box;
        margin-bottom: 12px;
      }
      .key-card button {
        padding: 10px 20px;
        border-radius: 8px;
        border: none;
        background: #4a90e2;
        color: white;
        cursor: pointer;
        font-size: 14px;
      }
    </style>
  </head>

  <body>
    <div id="keyOverlay" class="key-overlay" style="display: none">
      <div class="key-card">
        <h2>Gemini API key</h2>
        <p>
          This demo needs a Gemini API key with Live API access. Get one from
          <a
            href="https://aistudio.google.com/app/apikey"
            target="_blank"
            rel="noopener"
            >aistudio.google.com</a
          >. The key is saved in your browser's localStorage and only sent to
          Google.
        </p>
        <input id="keyInput" type="password" placeholder="AIza..." />
        <button id="keySave">save and reload</button>
      </div>
    </div>

    <div class="panel" id="panel">
      <div class="row">
        <button class="start" id="start">Start companion</button>
        <button class="stop" id="stop" disabled>Stop</button>
        <button id="clear">Clear labels</button>
      </div>
      <div class="transcript" id="transcript"></div>
      <div class="status" id="status">idle</div>
    </div>

    <script type="module" src="build/main.js"></script>
  </body>
</html>
